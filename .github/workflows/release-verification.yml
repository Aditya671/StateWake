name: Release Verification

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.23"
  RELEASE_PYTHON: "3.13"
  RELEASE_DIST_ARTIFACT: statewake-release-distributions
  RELEASE_EVIDENCE_ARTIFACT: statewake-release-evidence

jobs:
  governance:
    name: repository-governance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify repository governance
        env:
          STATEWAKE_GOVERNANCE_TOKEN: ${{ secrets.STATEWAKE_GOVERNANCE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/release/verify_repository_governance.py

  release-build:
    name: release-build
    needs: governance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install ${{ env.RELEASE_PYTHON }}

      - name: Install locked release validation environment
        run: uv sync --locked --python ${{ env.RELEASE_PYTHON }} --group dev --extra integrations

      - name: Run authoritative release SDLC profile
        run: >-
          uv run --no-sync python scripts/release/run_sdlc_validation.py
          --profile release --output release-metadata/sdlc-release-evidence.json

      - name: Build exact release distributions once
        run: uv build --no-sources

      - name: Verify exact package boundary
        run: uv run --no-sync python scripts/release/verify_package_boundary.py dist

      - name: Validate distribution metadata
        run: uvx twine@7.0.0 check dist/*.whl dist/*.tar.gz

      - name: Freeze release metadata
        shell: bash
        run: |
          mkdir -p release-metadata
          cp verification/release-candidate-evidence.json release-metadata/release-candidate-evidence.json
          printf '%s\n' "$GITHUB_SHA" > release-metadata/source-revision.txt
          sha256sum dist/* > release-metadata/SHA256SUMS

      - name: Upload immutable release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.RELEASE_DIST_ARTIFACT }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Upload immutable release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.RELEASE_EVIDENCE_ARTIFACT }}
          path: release-metadata/
          if-no-files-found: error
          retention-days: 90

  consumer-compatibility:
    name: consumer-compatibility (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: release-build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out tests for the verified source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download exact verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.RELEASE_DIST_ARTIFACT }}
          path: dist

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install exact wheel and consumer test dependency
        shell: bash
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install "$wheel" "pytest==9.1.1"

      - name: Verify public import and CLI surfaces
        shell: bash
        run: |
          python -c "import statewake; from statewake import load_evidence_chain, verify_evidence_chain; print(statewake.__version__)"
          statewake version
          statewake --help

      - name: Verify workspace behavior against installed wheel
        run: python -m pytest -q --override-ini=pythonpath= tests/workspace

  native-sdk-integrations:
    name: native-sdk-integrations (py${{ matrix.python-version }})
    needs: release-build
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out integration tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download exact verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.RELEASE_DIST_ARTIFACT }}
          path: dist

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install exact wheel with integration SDKs
        shell: bash
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install "${wheel}[integrations]" "pytest==9.1.1"

      - name: Require native SDK imports
        run: >-
          python -c
          "import agents.tracing.processor_interface;
          import langchain_core.callbacks.base;
          import langgraph.graph;
          import llama_index.core.instrumentation.event_handlers;
          import opentelemetry.sdk.trace"

      - name: Run integration contracts against installed wheel
        run: >-
          python -m pytest -q --override-ini=pythonpath=
          tests/unit/integrations/test_native_sdk_import_contracts.py
          tests/unit/integrations/test_native_sdk_capture.py
          tests/unit/integrations/test_native_evidence_boundaries.py

  dependency-audit:
    name: dependency-audit
    needs: release-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.RELEASE_DIST_ARTIFACT }}
          path: dist

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install exact wheel and pinned audit tool
        run: python -m pip install dist/*.whl "pip-audit==2.10.1"

      - name: Audit installed runtime dependencies
        run: pip-audit --format=json --output=pip-audit.json

      - name: Upload dependency audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: statewake-release-dependency-audit
          path: pip-audit.json
          if-no-files-found: error
          retention-days: 90

  sbom:
    name: sbom
    needs: release-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.RELEASE_DIST_ARTIFACT }}
          path: dist

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: statewake-release-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

  provenance:
    name: provenance
    needs: release-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download exact verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.RELEASE_DIST_ARTIFACT }}
          path: dist

      - name: Generate build-provenance attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "dist/*"
