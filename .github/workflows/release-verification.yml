name: Release Verification

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      wheel: ${{ steps.paths.outputs.wheel }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv lock --check
      - run: uv python install 3.13
      - run: uv sync --locked --python 3.13
      - run: uv run python scripts/release/verify_versioning.py
      - run: uv build
      - run: uv run python scripts/release/verify_package_boundary.py dist
      - id: paths
        shell: bash
        run: echo "wheel=$(ls dist/*.whl | head -1)" >> "$GITHUB_OUTPUT"
      - name: Checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  native-sdk-integrations:
    # These checks must use installed SDKs: importorskip-only tests cannot
    # establish compatibility when optional dependencies were not installed.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv lock --check
      - run: uv sync --locked --python ${{ matrix.python-version }} --group dev
      - name: Require real native SDKs before compatibility tests
        run: >-
          uv run --no-sync python -c
          "import agents.tracing.processor_interface;
          import langchain_core.callbacks.base;
          import langgraph.graph;
          import llama_index.core.instrumentation.event_handlers;
          import opentelemetry.sdk.trace"
      - name: Run native SDK import and capture tests
        run: >-
          uv run --no-sync python -m pytest -q
          tests/unit/integrations/test_native_sdk_import_contracts.py
          tests/unit/integrations/test_native_sdk_capture.py
          tests/unit/integrations/test_native_evidence_boundaries.py

  clean-consumer:
    needs: build
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact built wheel
        shell: bash
        run: python -m pip install --no-deps "$(find dist -name '*.whl' -print -quit)"
      - name: Install declared runtime dependencies
        run: python -m pip install 'PyNaCl==1.6.2' 'opentelemetry-api==1.44.0' 'filelock==3.32.4'
      - name: CLI surface smoke
        run: >-
          python -c "import subprocess,sys; from statewake.cli.main import supported_commands;
          subprocess.run([sys.executable,'-m','statewake.cli.main','version'],check=True);
          [subprocess.run([sys.executable,'-m','statewake.cli.main',c,'--help'],check=True) for c in supported_commands()]"
      - name: Public import smoke
        run: python -c "import statewake; from statewake import load_evidence_chain, verify_evidence_chain; print(statewake.__version__)"
      - name: CLI smoke
        run: statewake version


  workspace-consumer:
    needs: build
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install built wheel and workspace dependencies
        shell: bash
        run: |
          python -m pip install --no-deps "$(find dist -name '*.whl' -print -quit)"
          python -m pip install 'PyNaCl==1.6.2' 'opentelemetry-api==1.44.0' 'filelock==3.32.4'
          python -m pip install 'duckdb==1.5.5' 'openpyxl==3.1.5' 'pyarrow==25.0.1' 'sqlalchemy==2.0.54'
      - name: Workspace adapter import smoke
        run: >-
          python -c "import duckdb, openpyxl, pyarrow, sqlalchemy;
          import statewake.workspace as workspace;
          print('workspace-adapters-ok', duckdb.__version__, openpyxl.__version__, pyarrow.__version__, sqlalchemy.__version__);
          print(workspace.DuckDBAnalyticalAdapter, workspace.SqlAlchemyWorkspaceRepository)"
      - name: Workspace regression suite
        run: python -m pytest -q tests/workspace

  dependency-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install dist/*.whl pip-audit
      - run: pip-audit --format=json --output=pip-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-dependency-audit
          path: pip-audit.json

  sbom:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - uses: anchore/sbom-action@v0
        with:
          path: dist
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-sbom
          path: sbom.cdx.json

  provenance:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'dist/*'
