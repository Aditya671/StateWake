name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: quality-and-tests (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv python install ${{ matrix.python-version }}
      - run: uv lock --check --python ${{ matrix.python-version }}
      - run: uv sync --locked --python ${{ matrix.python-version }} --group dev --extra integrations

      - name: Execute SDLC check profile
        run: uv run --no-sync --python ${{ matrix.python-version }} python scripts/release/run_sdlc_validation.py --profile check

      - name: Verify CLI version
        run: uv run --no-sync --python ${{ matrix.python-version }} statewake version

      - name: Run first evidence-chain example
        run: uv run --no-sync --python ${{ matrix.python-version }} python examples/first-evidence-chain.py

      - name: Build package
        run: uv build --no-sources

      - name: Verify package boundary
        run: uv run --no-sync --python ${{ matrix.python-version }} python scripts/release/verify_package_boundary.py dist

      - name: Run failure lab on Windows
        if: matrix.os == 'windows-latest'
        run: uv run --no-sync --python ${{ matrix.python-version }} python scripts/testing/failure_lab.py --ci
