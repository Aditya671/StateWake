# StateWake package publication workflow.
#
# Publication is deliberately separated from ordinary CI:
#   1. Build and verify the exact distributions once.
#   2. Generate build provenance for those exact files.
#   3. Publish to TestPyPI only through an explicit manual dispatch.
#   4. Publish to production PyPI only when a GitHub Release is published.
#
# Both registries use Trusted Publishing (GitHub OIDC). No long-lived
# PyPI/TestPyPI API token is stored in GitHub Actions secrets.
#
# Configure these GitHub environments/publishers before enabling publication:
#   - testpypi -> TestPyPI Trusted Publisher for this workflow/environment
#   - pypi     -> PyPI Trusted Publisher for this workflow/environment

name: Publish Python Package

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Package registry to publish to"
        required: true
        type: choice
        options:
          - testpypi
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: package-publication
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Validate lockfile
        run: uv lock --check

      - name: Install locked development environment
        run: uv sync --locked --python 3.13

      - name: Validate release version
        run: uv run python scripts/release/verify_versioning.py

      - name: Run SDLC release validation
        run: uv run python scripts/release/run_sdlc_validation.py --profile release

      - name: Verify repository governance
        env:
          GITHUB_TOKEN: ${{ secrets.STATEWAKE_GOVERNANCE_TOKEN }}
        run: uv run python scripts/release/verify_repository_governance.py

      - name: Verify repository structure
        run: uv run python scripts/release/verify_repository_structure.py

      - name: Verify CLI surface
        run: uv run python scripts/release/verify_cli_surface.py

      - name: Verify product experience
        run: uv run python scripts/release/verify_product_experience.py

      - name: Verify release candidate
        run: uv run python scripts/release/verify_release_candidate.py --skip-build

      - name: Run formatting check
        run: uv run ruff format --check src tests scripts examples

      - name: Run lint checks
        run: uv run ruff check src tests scripts examples

      - name: Run strict type checks
        run: uv run --extra integrations mypy

      - name: Run test suite
        run: uv run pytest

      - name: Build clean distributions
        run: |
          rm -rf dist
          uv build --no-sources

      - name: Verify package boundary
        run: uv run python scripts/release/verify_package_boundary.py dist

      - name: Validate distribution metadata
        run: uvx twine@7.0.0 check dist/*.whl dist/*.tar.gz

      - name: Stage exact publication distributions
        run: |
          rm -rf publish-dist
          mkdir -p publish-dist release-metadata
          cp dist/*.whl dist/*.tar.gz publish-dist/

      - name: Generate checksums
        run: sha256sum publish-dist/* > release-metadata/SHA256SUMS

      - name: Freeze canonical publication basis
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            target="pypi"
          else
            target="testpypi"
          fi
          cp verification/release-candidate-evidence.json release-metadata/release-candidate-evidence.json
          uv run python scripts/release/create_publication_basis.py \
            --target "$target" \
            --dist publish-dist \
            --verification-evidence release-metadata/release-candidate-evidence.json \
            --expected-source-revision "$GITHUB_SHA" \
            --output release-metadata/publication-basis.json

      - name: Generate build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "publish-dist/*"

      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: statewake-python-distributions
          path: publish-dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: statewake-release-metadata
          path: release-metadata/
          if-no-files-found: error
          retention-days: 14

  clean-consumer:
    name: Verify exact wheel in clean environments
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: statewake-python-distributions
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install exact built wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Verify public import surface
        run: >-
          python -c "import statewake; from statewake import load_evidence_chain, verify_evidence_chain; print(statewake.__version__)"

      - name: Verify CLI surface
        run: |
          statewake version
          statewake --help

  native-sdk-integrations:
    name: Verify native SDK compatibility before publication
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv lock --check
      - run: uv sync --locked --python ${{ matrix.python-version }} --group dev --extra integrations
      - name: Require real native SDKs before compatibility tests
        run: >-
          uv run --no-sync python -c
          "import agents.tracing.processor_interface;
          import langchain_core.callbacks.base;
          import langgraph.graph;
          import llama_index.core.instrumentation.event_handlers;
          import opentelemetry.sdk.trace"
      - name: Run native SDK import and capture tests
        run: >-
          uv run --no-sync python -m pytest -q
          tests/unit/integrations/test_native_sdk_import_contracts.py
          tests/unit/integrations/test_native_sdk_capture.py
          tests/unit/integrations/test_native_evidence_boundaries.py

  dependency-audit:
    name: Audit published runtime dependencies
    needs:
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: statewake-python-distributions
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install package and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl pip-audit

      - name: Run pip-audit
        run: pip-audit --format=json --output=pip-audit.json

      - name: Upload dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: statewake-dependency-audit
          path: pip-audit.json

  publish-testpypi:
    name: Publish to TestPyPI
    needs:
      - build
      - clean-consumer
      - native-sdk-integrations
      - dependency-audit
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    environment:
      name: testpypi
      url: https://test.pypi.org/project/statewake-ai/

    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.13 and locked environment
        run: |
          uv python install 3.13
          uv sync --locked --python 3.13

      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: statewake-python-distributions
          path: dist

      - name: Download canonical release metadata
        uses: actions/download-artifact@v4
        with:
          name: statewake-release-metadata
          path: release-metadata

      - name: Record protected-environment publication authorization
        run: >-
          uv run python scripts/release/record_publication_authorization_from_github.py
          --basis release-metadata/publication-basis.json
          --workspace publication-authority
          --target testpypi

      - name: Issue fresh publication execution permit
        run: >-
          uv run python scripts/release/verify_publication_execution.py
          --basis release-metadata/publication-basis.json
          --workspace publication-authority
          --dist dist
          --verification-evidence release-metadata/release-candidate-evidence.json
          --target testpypi
          --expected-source-revision "$GITHUB_SHA"
          --output release-metadata/publication-permit.json

      - name: Upload canonical publication authorization evidence
        uses: actions/upload-artifact@v4
        with:
          name: statewake-testpypi-publication-authorization
          path: |
            publication-authority/
            release-metadata/publication-basis.json
            release-metadata/publication-permit.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs:
      - build
      - clean-consumer
      - native-sdk-integrations
      - dependency-audit
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/statewake-ai/

    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.13 and locked environment
        run: |
          uv python install 3.13
          uv sync --locked --python 3.13

      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: statewake-python-distributions
          path: dist

      - name: Download canonical release metadata
        uses: actions/download-artifact@v4
        with:
          name: statewake-release-metadata
          path: release-metadata

      - name: Record protected-environment publication authorization
        run: >-
          uv run python scripts/release/record_publication_authorization_from_github.py
          --basis release-metadata/publication-basis.json
          --workspace publication-authority
          --target pypi

      - name: Issue fresh publication execution permit
        run: >-
          uv run python scripts/release/verify_publication_execution.py
          --basis release-metadata/publication-basis.json
          --workspace publication-authority
          --dist dist
          --verification-evidence release-metadata/release-candidate-evidence.json
          --target pypi
          --expected-source-revision "$GITHUB_SHA"
          --output release-metadata/publication-permit.json

      - name: Upload canonical publication authorization evidence
        uses: actions/upload-artifact@v4
        with:
          name: statewake-pypi-publication-authorization
          path: |
            publication-authority/
            release-metadata/publication-basis.json
            release-metadata/publication-permit.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  reconcile-testpypi:
    name: Reconcile TestPyPI publication
    needs:
      - publish-testpypi
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.13 and locked environment
        run: |
          uv python install 3.13
          uv sync --locked --python 3.13

      - name: Download publication authorization evidence
        uses: actions/download-artifact@v4
        with:
          name: statewake-testpypi-publication-authorization
          path: publication-evidence

      - name: Independently reconcile TestPyPI registry bytes
        run: >-
          uv run python scripts/release/reconcile_registry_publication.py
          --basis publication-evidence/release-metadata/publication-basis.json
          --permit publication-evidence/release-metadata/publication-permit.json
          --target testpypi
          --output release-metadata/registry-publication-receipt.json

      - name: Initialize TestPyPI registry lifecycle history
        run: >-
          uv run python scripts/release/reconcile_registry_publication_lifecycle.py
          --basis publication-evidence/release-metadata/publication-basis.json
          --permit publication-evidence/release-metadata/publication-permit.json
          --receipt release-metadata/registry-publication-receipt.json
          --history release-metadata/registry-publication-lifecycle.jsonl
          --target testpypi

      - name: Upload reconciled TestPyPI publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: statewake-testpypi-registry-publication-receipt
          path: |
            release-metadata/registry-publication-receipt.json
            release-metadata/registry-publication-lifecycle.jsonl
          if-no-files-found: error
          retention-days: 90

  reconcile-pypi:
    name: Reconcile PyPI publication
    needs:
      - publish-pypi
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.13 and locked environment
        run: |
          uv python install 3.13
          uv sync --locked --python 3.13

      - name: Download publication authorization evidence
        uses: actions/download-artifact@v4
        with:
          name: statewake-pypi-publication-authorization
          path: publication-evidence

      - name: Independently reconcile PyPI registry bytes
        run: >-
          uv run python scripts/release/reconcile_registry_publication.py
          --basis publication-evidence/release-metadata/publication-basis.json
          --permit publication-evidence/release-metadata/publication-permit.json
          --target pypi
          --output release-metadata/registry-publication-receipt.json

      - name: Initialize PyPI registry lifecycle history
        run: >-
          uv run python scripts/release/reconcile_registry_publication_lifecycle.py
          --basis publication-evidence/release-metadata/publication-basis.json
          --permit publication-evidence/release-metadata/publication-permit.json
          --receipt release-metadata/registry-publication-receipt.json
          --history release-metadata/registry-publication-lifecycle.jsonl
          --target pypi

      - name: Upload reconciled PyPI publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: statewake-pypi-registry-publication-receipt
          path: |
            release-metadata/registry-publication-receipt.json
            release-metadata/registry-publication-lifecycle.jsonl
          if-no-files-found: error
          retention-days: 90
