# Publish only distributions produced by a successful Release Verification run.
# Source/build verification and OIDC publication remain separate trust boundaries.
name: Publish Python Package

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Package registry to publish to"
        required: true
        type: choice
        options: [testpypi]
      verification_run_id:
        description: "Successful Release Verification workflow run ID to publish"
        required: true
        type: string
  release:
    types: [published]

permissions:
  actions: read
  contents: read

concurrency:
  group: package-publication
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.23"
  RELEASE_DIST_ARTIFACT: statewake-release-distributions
  RELEASE_EVIDENCE_ARTIFACT: statewake-release-evidence
  PUBLICATION_READY_ARTIFACT: statewake-publication-ready
  PYTHONPATH: src

jobs:
  resolve-release:
    name: resolve-verified-release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      run-id: ${{ steps.resolve.outputs.run_id }}
      source-revision: ${{ steps.source.outputs.source_revision }}
      target: ${{ steps.target.outputs.target }}
      registry-upload-url: ${{ steps.target.outputs.registry_upload_url }}
      registry-project-url: ${{ steps.target.outputs.registry_project_url }}
    steps:
      - name: Check out publication orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve successful Release Verification run
        id: resolve
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MANUAL_RUN_ID: ${{ inputs.verification_run_id || '' }}
        run: |
          args=(
            --repository "$GITHUB_REPOSITORY"
            --workflow-path ".github/workflows/release-verification.yml"
            --github-output "$GITHUB_OUTPUT"
          )
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            args+=(--run-id "$MANUAL_RUN_ID")
          else
            args+=(
              --expected-source-revision "$GITHUB_SHA"
              --wait-seconds 1800
              --poll-seconds 15
            )
          fi
          python scripts/release/resolve_release_verification_run.py "${args[@]}"

      - name: Resolve publication target
        id: target
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "target=pypi" >> "$GITHUB_OUTPUT"
            echo "registry_upload_url=https://upload.pypi.org/legacy/" >> "$GITHUB_OUTPUT"
            echo "registry_project_url=https://pypi.org/project/statewake-ai/" >> "$GITHUB_OUTPUT"
          else
            echo "target=testpypi" >> "$GITHUB_OUTPUT"
            echo "registry_upload_url=https://test.pypi.org/legacy/" >> "$GITHUB_OUTPUT"
            echo "registry_project_url=https://test.pypi.org/project/statewake-ai/" >> "$GITHUB_OUTPUT"
          fi

      - name: Download verification evidence from resolved run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.RELEASE_EVIDENCE_ARTIFACT }}
          path: release-metadata
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve.outputs.run_id }}

      - name: Verify resolved source and release boundary
        id: source
        shell: bash
        env:
          TARGET: ${{ steps.target.outputs.target }}
          RESOLVED_EVENT: ${{ steps.resolve.outputs.event }}
          RESOLVED_HEAD_BRANCH: ${{ steps.resolve.outputs.head_branch }}
          RESOLVED_HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          source_revision="$(tr -d '\r\n' < release-metadata/source-revision.txt)"
          if ! [[ "$source_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release Verification source revision is invalid." >&2
            exit 1
          fi
          if [ "$source_revision" != "$RESOLVED_HEAD_SHA" ]; then
            echo "Release evidence source revision does not match the selected workflow run." >&2
            exit 1
          fi
          python - <<'PY_EVIDENCE'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path("release-metadata/release-candidate-evidence.json").read_text(
                  encoding="utf-8"
              )
          )
          if payload.get("status") != "passed" or payload.get("publication_authorized") is not False:
              raise SystemExit("release-candidate evidence is not an unpublished passed candidate")
          version = payload.get("version")
          if not isinstance(version, str) or not version:
              raise SystemExit("release-candidate evidence is missing package version")
          if os.environ["TARGET"] == "pypi":
              if os.environ["RESOLVED_EVENT"] != "push":
                  raise SystemExit("PyPI requires Release Verification from the version-tag push")
              if os.environ["RESOLVED_HEAD_BRANCH"] != f"v{version}":
                  raise SystemExit("PyPI Release Verification tag does not match package version")
          PY_EVIDENCE
          echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"

  prepare-publication:
    name: prepare-publication
    needs: resolve-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact verified source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.source-revision }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python and locked runtime environment
        run: |
          uv python install 3.13
          uv sync --locked --python 3.13 --no-install-project

      - name: Download exact verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.RELEASE_DIST_ARTIFACT }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-release.outputs.run-id }}

      - name: Download verification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.RELEASE_EVIDENCE_ARTIFACT }}
          path: release-metadata
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-release.outputs.run-id }}

      - name: Verify exact distribution and source identity
        run: |
          sha256sum -c release-metadata/SHA256SUMS
          uv run --no-sync python scripts/release/verify_release_identity.py
          uv run --no-sync python scripts/security/verify_continuous_security_assurance.py --no-reverify --require-zero-drift

      - name: Freeze canonical publication basis
        run: >-
          uv run --no-sync python scripts/release/create_publication_basis.py
          --target "${{ needs.resolve-release.outputs.target }}"
          --dist dist
          --verification-evidence release-metadata/release-candidate-evidence.json
          --source-revision "${{ needs.resolve-release.outputs.source-revision }}"
          --output release-metadata/publication-basis.json

      - name: Record event-scoped publication authorization
        run: >-
          uv run --no-sync python scripts/release/record_publication_authorization_from_github.py
          --basis release-metadata/publication-basis.json
          --workspace publication-authority
          --target "${{ needs.resolve-release.outputs.target }}"

      - name: Issue fresh publication execution permit
        run: >-
          uv run --no-sync python scripts/release/verify_publication_execution.py
          --basis release-metadata/publication-basis.json
          --workspace publication-authority
          --dist dist
          --verification-evidence release-metadata/release-candidate-evidence.json
          --target "${{ needs.resolve-release.outputs.target }}"
          --expected-source-revision "${{ needs.resolve-release.outputs.source-revision }}"
          --output release-metadata/publication-permit.json

      - name: Assemble immutable publication-ready bundle
        shell: bash
        run: |
          mkdir -p publication-ready/dist publication-ready/evidence
          cp dist/* publication-ready/dist/
          cp release-metadata/SHA256SUMS publication-ready/evidence/SHA256SUMS
          cp release-metadata/source-revision.txt publication-ready/evidence/source-revision.txt
          cp release-metadata/release-candidate-evidence.json publication-ready/evidence/release-candidate-evidence.json
          cp release-metadata/publication-basis.json publication-ready/evidence/publication-basis.json
          cp release-metadata/publication-permit.json publication-ready/evidence/publication-permit.json
          cp -R publication-authority publication-ready/evidence/publication-authority

      - name: Upload immutable publication-ready bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PUBLICATION_READY_ARTIFACT }}
          path: publication-ready/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish-${{ needs.resolve-release.outputs.target }}
    needs: [resolve-release, prepare-publication]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
    environment:
      name: ${{ needs.resolve-release.outputs.target }}
      url: ${{ needs.resolve-release.outputs.registry-project-url }}
    steps:
      - name: Download authorized publication-ready distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PUBLICATION_READY_ARTIFACT }}
          path: publication-ready

      - name: Publish exact verified distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: publication-ready/dist/
          repository-url: ${{ needs.resolve-release.outputs.registry-upload-url }}
          skip-existing: ${{ needs.resolve-release.outputs.target == 'testpypi' && 'true' || 'false' }}

  reconcile:
    name: reconcile-${{ needs.resolve-release.outputs.target }}
    needs: [resolve-release, prepare-publication, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact verified source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.source-revision }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python and locked runtime environment
        run: |
          uv python install 3.13
          uv sync --locked --python 3.13 --no-install-project

      - name: Download publication-ready evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PUBLICATION_READY_ARTIFACT }}
          path: publication-ready

      - name: Independently reconcile registry bytes
        run: >-
          uv run --no-sync python scripts/release/reconcile_registry_publication.py
          --basis publication-ready/evidence/publication-basis.json
          --permit publication-ready/evidence/publication-permit.json
          --target "${{ needs.resolve-release.outputs.target }}"
          --output release-metadata/registry-publication-receipt.json

      - name: Initialize registry lifecycle history
        run: >-
          uv run --no-sync python scripts/release/reconcile_registry_publication_lifecycle.py
          --basis publication-ready/evidence/publication-basis.json
          --permit publication-ready/evidence/publication-permit.json
          --receipt release-metadata/registry-publication-receipt.json
          --history release-metadata/registry-publication-lifecycle.jsonl
          --target "${{ needs.resolve-release.outputs.target }}"

      - name: Upload reconciled registry evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: statewake-${{ needs.resolve-release.outputs.target }}-registry-publication-receipt
          path: |
            release-metadata/registry-publication-receipt.json
            release-metadata/registry-publication-lifecycle.jsonl
          if-no-files-found: error
          retention-days: 90
