name: Platform Canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  UV_VERSION: "0.12.23"

jobs:
  ubuntu-26-04-canary:
    name: ubuntu-26.04-canary
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python and locked validation environment
        run: |
          uv python install 3.13
          uv sync --locked --python 3.13 --group dev --extra integrations

      - name: Run portability canary
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_script_portability.py
          tests/security/test_runtime_containment.py
          tests/workspace/test_sqlite_repository.py

      - name: Build package on next Ubuntu image
        run: uv build --no-sources
